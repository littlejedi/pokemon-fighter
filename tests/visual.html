<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>召唤画面验收</title><style>body{margin:24px;background:#101c2b;color:#eef3e9;font-family:sans-serif}canvas{display:block;max-width:100%;height:auto;border:1px solid #698099;margin-bottom:24px}p{font-size:13px;color:#b7cad6}h2{font-size:18px}</style><h2>召唤特写 · 技能名称阶段</h2><p>使用实际游戏渲染器，在 2.45 秒时固定画面，核对训练家、宝可梦和标题。</p><canvas id="cinema" width="1920" height="996"></canvas><h2>战场体型对照 · 同一世界比例</h2><p>皮卡丘 0.4m、小智（游戏基准）、水箭龟 1.6m。此页仅用于验收，正常战斗无常驻宝可梦。</p><canvas id="sizes" width="1920" height="996"></canvas><p id="state">加载中</p><script type="module">
import {loadArt,drawCinematic,drawStage,drawTrainer,drawPokemon,drawShadow,art} from '/src/art.js';
await loadArt();const c=document.querySelector('#cinema').getContext('2d');c.scale(2,2);drawCinematic(c,{id:0,elapsed:2.45,duration:3.2},{name:'小智',poke:'皮卡丘',super:'十万伏特',color:'#426d9c'});
const s=document.querySelector('#sizes').getContext('2d');s.scale(2,2);drawStage(s,0,0);drawTrainer(s,0,460,425);drawPokemon(s,0,230,425);drawPokemon(s,13,700,425);for(const[x,label]of[[230,'皮卡丘 · 0.4 m'],[460,'训练家'],[700,'水箭龟 · 1.6 m']]){s.fillStyle='#fff';s.font='16px sans-serif';s.textAlign='center';s.fillText(label,x,466)}document.querySelector('#state').textContent=`素材已载入。新训练家图集 ${Object.keys(art.atlases.trainers).length}/15，新伙伴侧视贴图 ${Object.keys(art.atlases.partners).length}/15。`;
</script></html>
